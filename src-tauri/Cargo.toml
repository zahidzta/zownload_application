[package]
name = "zownload"
version = "0.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "zownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3" }

[dependencies]
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4" }
tauri-plugin-dialog = { version = "=2.7.3" }
uuid = { version = "=1.28.0", features = ["v4"] }
base64 = "=0.22.1"
zip = { version = "=9.0.5", default-features = false }
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
