[package]
name = "zownload"
version = "0.0.0"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "zownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.4" }

[dev-dependencies]
serde_json = "=1.0.154"
