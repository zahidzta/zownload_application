[package]
name = "zownload"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "zownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3" }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.4" }
