name: Gate 0B engine builds

on:
  push:
    paths:
      - .github/workflows/gate-0b-engines.yml
      - scripts/gate-0b/build-quickjs.sh

permissions:
  contents: read

jobs:
  quickjs-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify QuickJS Linux x64
        run: bash scripts/gate-0b/build-quickjs.sh linux-x64 --verify
  quickjs-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify QuickJS macOS x64
        run: bash scripts/gate-0b/build-quickjs.sh macos-x64 --verify
  quickjs-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify QuickJS macOS arm64
        run: bash scripts/gate-0b/build-quickjs.sh macos-arm64 --verify
  quickjs-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Build and inspect QuickJS Android arm64
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}/ndk/30.0.16248370"
          bash scripts/gate-0b/build-quickjs.sh android-arm64 --verify
