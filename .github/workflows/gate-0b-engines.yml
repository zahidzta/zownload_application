name: Gate 0B engine builds

on:
  push:
    paths:
      - .github/workflows/gate-0b-engines.yml
      - scripts/gate-0b/build-quickjs.sh

permissions:
  contents: read

jobs:
  quickjs-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify QuickJS Linux x64
        run: bash scripts/gate-0b/build-quickjs.sh linux-x64 --verify
