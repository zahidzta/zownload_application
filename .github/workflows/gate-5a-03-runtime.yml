name: Gate 5A-03 CPython runtime

on:
  push:
    branches:
      - task-5a-03

permissions:
  contents: read

jobs:
  cpython-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install CPython host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file git libbz2-dev libffi-dev \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libncurses-dev libreadline-dev \
            libsqlite3-dev libssl-dev patch pkg-config python3 tar wget xz-utils zlib1g-dev

      - name: Download pinned Corretto 21
        run: |
          curl --fail --location --silent --show-error \
            'https://corretto.aws/downloads/resources/21.0.11.10.1/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz' \
            --output "$RUNNER_TEMP/corretto.tar.gz"
          echo '5b4dc8817df13f88f9bfc434e5d018adb535889ff2fe0ccf758bcebcc216f394  '"$RUNNER_TEMP/corretto.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/corretto-21"
          tar -xzf "$RUNNER_TEMP/corretto.tar.gz" -C "$RUNNER_TEMP/corretto-21" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/corretto-21" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/corretto-21/bin" >> "$GITHUB_PATH"

      - name: Check pinned JDK
        run: java -version 2>&1 | grep -F 'Corretto-21.0.11.10.1'

      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false

      - name: Check pinned Android SDK and NDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*22[.]0[[:space:]]*$' "$sdk_root/cmdline-tools/22.0/source.properties"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*36[.]0[.]0[[:space:]]*$' "$sdk_root/build-tools/36.0.0/source.properties"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*30[.]0[.]16248370[[:space:]]*$' "$sdk_root/ndk/30.0.16248370/source.properties"
          test -x "$sdk_root/cmdline-tools/22.0/bin/sdkmanager"

      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false

      - name: Check Node and npm pins
        run: |
          test "$(node --version)" = 'v24.22.0'
          test "$(npm --version)" = '11.19.1'

      - name: Build and verify source-pinned CPython runtime
        run: pwsh -NoProfile -File scripts/gate-5a/verify.ps1 -Case python-runtime

      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.99.1
          rustup default 1.99.1

      - run: npm ci

      - name: Build and package pinned Android QuickJS and yt-dlp
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}/ndk/30.0.16248370"
          if ! bash scripts/gate-0b/build-quickjs.sh android-arm64 --verify > "$RUNNER_TEMP/quickjs-build.log" 2>&1; then
            tail -n 50 "$RUNNER_TEMP/quickjs-build.log"
            exit 1
          fi
          pwsh -NoProfile -File scripts/gate-0c/package-quickjs.ps1 \
            -QuickJsPath work/engine/build/quickjs/android-arm64/qjs

      - name: Build local Android debug APK for runtime packaging review
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npm run android:debug

      - name: Verify CPython runtime entries in the local APK
        run: |
          apk='src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk'
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libpython3.14.so'
          unzip -Z1 "$apk" | grep -F 'assets/python-runtime/lib/python3.14/os.py'
          echo "CPython APK runtime entries: $(unzip -Z1 "$apk" | grep -E '^(lib/arm64-v8a/libpython3[.]14|assets/python-runtime/)' | wc -l | tr -d ' ')"
