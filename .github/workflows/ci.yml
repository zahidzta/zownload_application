name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Check Node and npm pins
        shell: pwsh
        run: |
          if ((node --version).Trim() -ne 'v24.22.0') { throw 'Node version differs from the pin.' }
          if ((npm --version).Trim() -ne '11.19.1') { throw 'npm version differs from the pin.' }
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: npm ci
      - name: Verify frontend, contracts, Rust, and design
        run: powershell -NoProfile -File scripts/verify-foundation.ps1

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Check Node and npm pins
        run: |
          test "$(node --version)" = 'v24.22.0'
          test "$(npm --version)" = '11.19.1'
      - name: Download pinned Corretto 21
        run: |
          curl --fail --location --silent --show-error \
            'https://corretto.aws/downloads/resources/21.0.11.10.1/amazon-corretto-21.0.11.10.1-linux-x64.tar.gz' \
            --output "$RUNNER_TEMP/corretto.tar.gz"
          echo '5b4dc8817df13f88f9bfc434e5d018adb535889ff2fe0ccf758bcebcc216f394  '"$RUNNER_TEMP/corretto.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/corretto-21"
          tar -xzf "$RUNNER_TEMP/corretto.tar.gz" -C "$RUNNER_TEMP/corretto-21" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/corretto-21" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/corretto-21/bin" >> "$GITHUB_PATH"
      - name: Check JDK pin
        run: |
          java -version 2>&1 | grep -F 'Corretto-21.0.11.10.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Check SDK and NDK pins
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          check_revision() {
            local package="$1" expected="$2"
            local properties="$android_sdk/$package/source.properties"
            if [[ ! -f "$properties" ]]; then
              echo "::error::Missing $properties" >&2
              return 1
            fi
            local actual
            actual="$(sed -nE 's/^Pkg[.]Revision[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' "$properties")"
            echo "$package revision: ${actual:-missing} (expected $expected)"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected $package revision" >&2
              return 1
            fi
          }
          check_revision 'cmdline-tools/22.0' '22.0'
          check_revision 'platform-tools' '37.0.1'
          check_revision 'build-tools/36.0.0' '36.0.0'
          check_revision 'ndk/30.0.16248370' '30.0.16248370'
          if [[ ! -f "$android_sdk/platforms/android-36/android.jar" ]]; then
            echo '::error::Android SDK platform 36 is missing' >&2
            exit 1
          fi
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$android_sdk/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.99.1
      - run: npm ci
      - name: Build and package pinned Android QuickJS and yt-dlp
        run: |
          if ! bash scripts/gate-0b/build-quickjs.sh android-arm64 --verify > "$RUNNER_TEMP/quickjs-build.log" 2>&1; then
            tail -n 50 "$RUNNER_TEMP/quickjs-build.log"
            exit 1
          fi
          pwsh -NoProfile -File scripts/gate-0c/package-quickjs.ps1 \
            -QuickJsPath work/engine/build/quickjs/android-arm64/qjs
      - name: Build Android debug APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npm run android:debug
